version: '3.8'

services:
  playwright-mcp:
    build: .
    restart: always
    # J'ai supprimé la ligne "entrypoint: []" qui bloquait
    
    # La commande complète (avec votre token browserless)
    command: >
      node cli.js 
      --host 0.0.0.0 
      --port 8931 
      --allowed-hosts='*' 
      --allowed-origins='*'
      --cdp-endpoint='wss://browserless.iask.solutions?token=By8Iver0Y1ZMOIF9iAt0wpluobdEXob7'
      
    ports:
      - "8931:8931"
    
    # Indispensable pour la stabilité
    shm_size: '2gb' 
    
    environment:
      - PORT=8931
