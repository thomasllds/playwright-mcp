version: '3.8'

services:
  playwright-mcp:
    build: .
    restart: always
    # IMPORTANT : On vide l'entrypoint pour reprendre le contrôle total du lancement
    entrypoint: []
    
    # Voici la commande unique qui contient TOUT (y compris votre token browserless)
    command: >
      node cli.js 
      --host 0.0.0.0 
      --port 8931 
      --allowed-hosts='*' 
      --allowed-origins='*'
      --cdp-endpoint='wss://browserless.iask.solutions?token=By8Iver0Y1ZMOIF9iAt0wpluobdEXob7'
      
    ports:
      - "8931:8931"
    
    # Toujours utile même avec browserless pour éviter que le processus Node ne s'étouffe
    shm_size: '2gb' 
    
    environment:
      - PORT=8931
