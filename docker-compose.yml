version: '3.8'
services:
  playwright-mcp:
    build: .
    restart: always
    # IMPORTANT : On vide l'entrypoint par défaut pour reprendre le contrôle total
    entrypoint: []

    # Maintenant, on définit la commande complète exacte
    command: >
      node cli.js
      --headless
      --browser chromium
      --no-sandbox
      --host 0.0.0.0
      --port 8931
      --allowed-hosts='*'
      --allowed-origins='*'

    ports:
      - "8931:8931"
    # Indispensable pour éviter les crashs de Chrome ("Out of Memory")
    shm_size: '2gb'
    environment:
      - PORT=8931
